<title>Posicionar en el primer elemento de un formulario</title>
<script src="prototype.js" type="text/javascript"></script>
</head>
<body onload="Form.focus($('peticion'));">
Centra el foco en el formulario:
<form id="peticion">
Nombre:<input disabled="true" type="text" id="nombre"/><br>
Apellido: <input type="text" id="apellido"/><br>
<input type="radio" name="genero" value="Hombre"/>Hombre
<input type="radio" name="genero" value="Mujer"/>Mujer
</form>
