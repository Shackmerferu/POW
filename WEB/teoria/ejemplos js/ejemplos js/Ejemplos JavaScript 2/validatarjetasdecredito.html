<HTML>
<HEAD>
<TITLE>Validaciones de Tarjetas de crédito</TITLE>
<SCRIPT language="JavaScript">

   numeros="0123456789";
   
   error= new creaerror();  
   errores= new Array();
  
   errores[1]="Número incorrecto de dígitos (la tarjeta VISA tiene 13 ó 16)";
   errores[2]="Las tarjetas VISA comienzan por el dígito 4";
   errores[3]="Número incorrecto de dígitos (la tarjeta AMERICAN EXPRESS tiene 15)";
   errores[4]="Las tarjetas AMERICAN EXPRESS comienzan por los dígitos 34 ó 37";
   errores[5]="Número incorrecto de dígitos (la tarjeta MASTERCARD  tiene 16)";
   errores[6]="Las tarjetas MASTERCARD comienzan por los dígitos 51,52,53,54 ó 55";
   errores[7]="Número incorrecto de dígitos (la tarjeta DINER'S CLUB tiene 14)";
   errores[8]=
         "Las tarjetas DINER'S CLUB comienzan por los dígitos 300,301,302,303,304,305,36 ó 38";
   errores[9]="Las tarjetas de crédito tienen entre 13 y 16 dígitos producido";
   errores[10]="Las tarjetas de crédito sólo contienen dígitos producido";
   errores[11]="No concuerda el dígito de control";
  
   // Crea un objeto que guarda un indice a la posición y al mensaje de error
   function creaerror()
   {
   this.valor=0;
   this.posicion=0;
   return this
   }
  
   // Determina si un caracter es un número
   function numero(car)
   {
   return (numeros.indexOf(car)>=0)
   }

   function compruebatarjetadecredito(contenido,error,tipo)
   {  
   if (tipo!=null)  // se conoce el tipo de tarjeta
      if (tipo=="VISA") 
         {
         if (!(contenido.length==13||contenido.length==16)) 
            {
            error.valor=1;
            error.posicion=contenido.length; 
            return false;
            }
         if (contenido.substring(0,1)!="4") 
            {
            error.valor=2;
            error.posicion=1; 
            return false;
            }
         }
      else 
      if (tipo=="AMERICANEXPRESS")
         {
         if (contenido.length!=15) 
            {
            error.valor=3;
            error.posicion=contenido.length; 
            return false;
            }
         if (!(contenido.substring(0,2)=="34" || contenido.substring(0,2)=="37")) 
            {
            error.valor=4;
            error.posicion=1; 
            return false;
            }   
         }
      else 
      if (tipo=="MASTERCARD")
         {
         if (contenido.length!=16) 
            {
            error.valor=5;
            error.posicion=contenido.length; 
            return false;
            }
         if (!(contenido.substring(0,2)>="51" && contenido.substring(0,2)<="55")) 
            {
            error.valor=6;
            error.posicion=1; 
            return false;
            } 
         }  
      else
      if (tipo=="DINERSCLUB")
         {
         if (contenido.length!=14) 
            {
            error.valor=7;
            error.posicion=contenido.length; 
            return false;
            } 
         if (!(contenido.substring(0,3)>="300" && contenido.substring(0,3)<="305")&&
             !(contenido.substring(0,2)=="36" || contenido.substring(0,2)=="38")) 
            {
            error.valor=8;
            error.posicion=1; 
            return false;
            } 
         }
   else // No se conoce el tipo de tarjeta
      if (contenido.length<13||contenido.length>16) 
         {
         error.valor=9;
         error.posicion=contenido.length; 
         return false;
         }
   // Comprobación de los dígitos de chequeo
   var primero=true;
   var sum1=0;
   var sum2=0;
   for (var i=(contenido.length-1); i>=0; i--)
      {
      if (!numero(contenido.charAt(i)))
         {
         error.valor=10;
         error.posicion=i; 
         return false;
         }
      else
      if (primero)
         sum1+=contenido.charAt(i)*1;
      else
         {
         var aux=contenido.charAt(i)*2;
         if (aux>=10) 
            aux=aux-9;
         sum2+=aux;  
         } 
      primero=!primero;
      } 
   if ((sum1+sum2)%10!=0)
      {
      error.valor=11;
      error.posicion=contenido.length; 
      return false;
      }
   return true;
   }
  
   // Ejecuta la validación pedida
   function ejecuta(valor)
   {
   var correcto;
   var objeto=eval('window.document.formulario.select');
   var tarjeta=objeto.options[objeto.selectedIndex].value;
   switch (valor)
      {
      case 1:
         correcto=
               compruebatarjetadecredito(window.document.formulario.campo.value,error,tarjeta);
         break;
      default:
         break; 
      }
   if (correcto)
      alert("El campo es válido")
   else
      alert("El campo NO es válido. ERROR:"+errores[error.valor]+
            " en la posicion "+error.posicion);
   }
  
</SCRIPT>
</HEAD>
<BODY>
<FORM NAME="formulario" ACTION="">

   <CENTER>
   <B>Validaciones de Tarjetas</B><BR><BR>
   Número:
   <INPUT TYPE="Text" VALUE="" NAME="campo">
   <SELECT NAME="select">
      <OPTION VALUE="">Genérica</OPTION>
      <OPTION VALUE="AMERICANEXPRESS">American Express</OPTION>
      <OPTION VALUE="DINERSCLUB">Diner´s Club</OPTION>
      <OPTION VALUE="MASTERCARD">Master Card</OPTION>
      <OPTION VALUE="VISA">Visa</OPTION>

   </SELECT><BR>
   <BR><BR><BR><BR><BR><BR>
   <INPUT TYPE="Button" VALUE="ValidaTarjetadecredito" onClick="ejecuta(1)">
   </CENTER>
   
</FORM>
</BODY>
</HTML>
