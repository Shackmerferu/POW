<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="Pico TransUber Packing" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header class="encabezado">
            <img src="logo.png" alt="Logo almacen" class="logo">
            <h1>Pico TransUber Packing</h1>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html" class="activo">Registrar</a></li>
        </ul>
    </nav>

    <main class="parteCentral">
        <h2>Registrese por favor</h2>
        <p>Por favor complete los campos para poder comenzar</p>

        <form class="formRegistro" id="formRegistro">
            <div class="form-grupo ">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div class="form-grupo ">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-grupo ">
                <label for="celular">Celular</label>
                <input type="tel" id="celular" name="celular" required>
            </div>
            <div class="form-grupo ">
                <label for="latitud">Latitud</label>
                <input type="number" id="latitud" name="latitud" readonly>
            </div>
            <div class="form-grupo ">
                <label for="longitud">Longitud</label>
                <input type="number" id="longitud" name="longitud" readonly>
            </div>
            <input type="hidden" id="disponible" name="disponible" value="S">
            <button type="submit" id="btnEnviar" class="btnEnviar">Enviar</button>

        </form>

    </main>

    <footer class="piePagina">
        <p>&copy; 2024 Pico TransUber Packing. Todos los derechos reservados.</p>
    </footer>

    
</body>
<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script src="js/index.js"></script>
</html>
