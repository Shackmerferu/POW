<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacen</title>
    <!-- Bootstrap CDN: estilos base (no editar si usas archivo local) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Hoja de estilos personalizada del proyecto -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Encabezado: contiene el logo y fondo azul -->
    <header class="py-3" style="background-color: #007bff;">
        <div class="container d-flex justify-content-end align-items-center">
            <!-- Imagen del logo (clase .logo controla tamaño en index.css) -->
            <img src="logo.png" alt="Logo almacen" class="logo">
        </div>
    </header>

    <!-- Contenedor principal de la aplicación -->
    <div class="container main-container mt-5">

        <main class="row content-row">
            <div class="col-md-5 form-container p-4">
                <!-- Formulario rápido para introducir ID, cantidad y precio -->
                <form>
                    <div class="mb-3">
                        <label for="codigo" class="form-label">Codigo (ID)</label>
                        <input type="number" class="form-control" id="codigo" name="codigo">
                    </div>
                    <div class="mb-3">
                        <label for="cantidad" class="form-label"> Cantidad </label>
                        <input type="number" class="form-control" id="cantidad" name="cantidad">
                    </div>
                    <div class="mb-3">
                        <label for="precio" class="form-label"> Precio </label>
                        <input type="number" class="form-control" id="precio" name="precio">
                    </div>
                </form>
            </div>
            <div class="col-md-7 display-container p-4">
            </div>
        </main>

        <!-- Fila de botones de acción (ALTA, BAJA, MOSTRAR, etc.) -->
        <div class="row button-row p-3">
            <!-- .btn-group agrupa botones y aplica separación via CSS -->
            <div class="col p-3 btn-group" role="group">
                <button type="button" class="btn btn-info text-white fw-bold" id="alta">ALTA</button>
                <button type="button" class="btn btn-info text-white fw-bold" id="baja">BAJA</button>
                <button type="button" class="btn btn-info text-white fw-bold" id="stock-bajo">STOCK BAJO</button>
                <button type="button" class="btn btn-info text-white fw-bold" id="mostrar">MOSTRAR</button>
                <button type="button" class="btn btn-info text-white fw-bold" id="agregar">AGREGAR</button>
                <button type="button" class="btn btn-info text-white fw-bold" id="borrar">BORRAR</button>
            </div>
        </div>

        <!-- Área de resultados: tabla y mensajes -->
        <div class="row table-row p-4">
            <div class="col"> <div class="table-responsive d-none" id="tabla-resultados-container">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Cant</th>
                                <th>Precio $</th>
                                <th>Cant Minima</th>
                                <th>Valor $$</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body"></tbody>
                    </table>
                </div>
                <div id="mensajes-container" class="mt-3"></div>
            </div>
        </div>

    <!-- el modal lo movi afuera del body porque necesitaba que fuera accesible desde cualquier parte del documento -->

    </div>
    <!-- Modal para agregar productos: formulario con campos del producto -->
    <div class="modal fade" id="agregarModal" tabindex="-1" aria-labelledby="agregarModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title" id="agregarModalLabel">Agregar Producto</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form id="modalForm">
                        <div class="mb-3">
                            <label for="modalCodigo" class="modal-label">Codigo (ID)</label>
                            <input type="number" class="form-control" id="modalCodigo">
                        </div>
                        <div class="mb-3">
                            <label for="modalNombre" class="modal-label">Nombre</label>
                            <input type="text" class="form-control" id="modalNombre">
                        </div>
                        <div class="mb-3">
                            <label for="modalCantidad" class="modal-label">Cantidad</label>
                            <input type="number" class="form-control" id="modalCantidad">
                        </div>
                        <div class="mb-3">
                            <label for="modalPrecioCosto" class="modal-label">Precio Costo</label>
                            <input type="number" class="form-control" id="modalPrecioCosto">
                        </div>
                        <div class="mb-3">
                            <label for="modalCantidadMinima" class="modal-label">Cant Minima</label>
                            <input type="number" class="form-control" id="modalCantidadMinima">
                        </div>
                        <div class="mb-3">
                            <label for="modalImagen" class="modal-label">Imagen</label>
                            <input type="file" class="form-control" id="modalImagen">
                        </div>
                    </form>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"> cerrar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardar" style="background-color: #17a2b8; border-color: #138496;">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: Bootstrap bundle y script principal de la app -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
