<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinalDiciembre</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="main-container">
        <header>
            <img src="front/img/turkish_patagonic.png" alt="logo" class="logo">
            <h1>Patagonic Turkish Helicopter</h1>
        </header>

        <div class="content-body">
            <div class="row text-center mt-3">
                <div class="col-6 p-4">
                    <h5 class="mb-3">Origen</h5>
                    <select id="origen" class="form-select mb-4">
                        <option value="">Seleccione Origen</option>
                    </select>

                    <div class="d-flex align-items-center mb-3">
                        <label class="me-3 label-fija">Latitud</label>
                        <input type="number" id="inputLatitudOrigen" class="form-control" placeholder="Lat1">
                    </div>
                    <div class="d-flex align-items-center">
                        <label class="me-3 label-fija">Longitud</label>
                        <input type="number" id="inputLongitudOrigen" class="form-control" placeholder="Log1">
                    </div>
                </div>

                <div class="col-6 p-4">
                    <h5 class="mb-3">Destino</h5>
                    <select id="destino" class="form-select mb-4">
                        <option value="">Seleccione Destino</option>
                    </select>

                    <div class="d-flex align-items-center mb-3">
                        <label class="me-3 label-fija">Latitud</label>
                        <input type="number" id="inputLatitudDestino" class="form-control" placeholder="Lat2">
                    </div>
                    <div class="d-flex align-items-center">
                        <label class="me-3 label-fija">Longitud</label>
                        <input type="number" id="inputLongitudDestino" class="form-control" placeholder="Lon2">
                    </div>
                </div>
            </div>

            <div class="text-center mt-4 mb-4">
                <button class="btn btn-primary" id="calcular">CONSULTAR</button>
            </div>
            <div class="table-responsive">
            <table class="table table-bordered">
                <tbody id="tablaVuelos"></tbody>

            </table>
            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
</body>
</html>
