<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Sistema</title>
    <link rel="stylesheet" href="../../bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- CAJA 1: EL LOGIN -->
    <div id="pantalla-login" class="container mt-5">
        <div class="card p-4 mx-auto shadow" style="max-width: 400px;">
            <h3 class="text-center mb-4">Iniciar Sesión</h3>
            <input type="text" id="usuario" class="form-control mb-3" placeholder="Usuario">
            <input type="password" id="clave" class="form-control mb-3" placeholder="Contraseña">
            
            <!-- Le sacamos el mb-2 porque borramos el botón extra que tenías de registro -->
            <button id="btn-ingresar" class="btn btn-primary w-100">Ingresar</button>
        </div>
    </div>

    <!-- Carga tu JS específico del login -->
    <script src="js/index.js"></script>
</body>
</html>
