<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso</title>
  <link href="lib/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card shadow-sm p-4 login-card">
      <h1 class="h3 mb-3">Iniciar sesión</h1>
      <form id="form-login">
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input id="usuario" name="usuario" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="clave" class="form-label">Contraseña</label>
          <input id="clave" name="clave" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
        <p id="mensaje-login" class="small mt-3 mb-0" role="status"></p>
      </form>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
