<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de administración</title>
  <link href="lib/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Sistema</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div id="menu" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><button class="nav-link active" data-vista="vista-listado">Listado</button></li>
        <li class="nav-item"><button class="nav-link" data-vista="vista-formulario">Registrar</button></li>
        <li class="nav-item"><button class="nav-link" data-vista="vista-imagen">Registrar con imagen</button></li>
      </ul>
      <button id="btn-salir" class="btn btn-outline-light btn-sm">Salir</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
    <div><h1 class="h3 mb-1">Panel</h1><p class="text-secondary mb-0">Administración de registros</p></div>
    <button id="btn-recargar" class="btn btn-outline-primary">Actualizar listado</button>
  </div>

  <section id="vista-listado" class="vista">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label for="filtro" class="form-label">Buscar</label>
        <input id="filtro" class="form-control" placeholder="Buscar en los registros…">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead><tr id="tabla-head"></tr></thead>
        <tbody id="tabla-body"><tr><td>Cargando…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section id="vista-formulario" class="vista d-none">
    <h2 class="h4" id="titulo-form">Registrar registro</h2>
    <form id="form-entidad" class="row g-3">
      <input type="hidden" id="registro-id">
      <div class="col-md-6"><label class="form-label" for="campo-nombre">Nombre / título</label><input id="campo-nombre" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="campo-descripcion">Descripción</label><input id="campo-descripcion" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label" for="campo-valor">Precio / valor</label><input id="campo-valor" type="number" min="0" step="0.01" class="form-control"></div>
      <div class="col-md-8"><label class="form-label" for="campo-extra">Categoría / dato adicional</label><input id="campo-extra" class="form-control"></div>
      <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button><button id="btn-cancelar" class="btn btn-secondary ms-2" type="button">Cancelar</button></div>
    </form>
    <p id="mensaje-entidad" class="mt-3" role="status"></p>
  </section>

  <section id="vista-imagen" class="vista d-none">
    <h2 class="h4">Registrar con imagen</h2>
    <form id="form-imagen" class="row g-3">
      <div class="col-md-6"><label class="form-label" for="img-archivo">Imagen</label><input id="img-archivo" type="file" accept="image/*" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="img-nombre">Nombre / título</label><input id="img-nombre" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="img-titulo-imagen">Título de imagen</label><input id="img-titulo-imagen" class="form-control"></div>
      <div class="col-md-6"><label class="form-label" for="img-descripcion">Descripción</label><input id="img-descripcion" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="img-alt">Texto alternativo</label><input id="img-alt" class="form-control"></div>
      <div class="col-md-6"><label class="form-label" for="img-descripcion-larga">Descripción larga</label><input id="img-descripcion-larga" class="form-control"></div>
      <div class="col-12"><button class="btn btn-primary">Subir registro</button></div>
    </form>
    <p id="mensaje-imagen" class="mt-3" role="status"></p>
  </section>
</main>

<div class="modal fade" id="modal-detalle" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="modal-titulo">Detalle</h2><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body" id="modal-contenido"></div>
  </div></div>
</div>

<script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script>
<script src="lib/exifreader/exif-reader.js"></script>
<script src="js/ui.js"></script><script src="js/entidad.js"></script><script src="js/imagen.js"></script>
</body>
</html>
