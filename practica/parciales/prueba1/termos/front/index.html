<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inicio de Sesión</title>

    <link rel="stylesheet" href="../recursos/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css" />
</head>

<body>
    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card h-100 w-50">
            <div class="bg-primary text-white card-header text-center ">
                <h3>Inicio Sesion</h3>
            </div>

            <form id="formLogin" class="d-flex flex-column gap-3 mb-3 mt-3 w-75 mx-auto">
                <div>
                    <label for="usuario" class="form-label">Usuario</label>

                    <input type="text" class="form-control" id="usuario" name="usuario"
                        placeholder="Ingrese su usuario" required />
                </div>

                <div>
                    <label for="contrasenia" class="form-label">Contraseña</label>

                    <input type="password" class="form-control" id="contrasenia" name="password" placeholder="12345"
                        required />
                </div>

                <button type="submit" class="btn btn-primary mx-auto mt-2">
                    Iniciar Sesion
                </button>

                <p id="mensaje" class="text-center"></p>
            </form>

            <div class="card-footer text-center bg-primary text-white">Sistema Termos</div>
        </div>
    </main>
    <script src="../recursos/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    <script src="js/login.js" defer></script>
</body>

</html>
