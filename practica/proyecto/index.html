<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Barra superior con el logo a la derecha -->
    <header class="barra-superior">
        <img src="imagenes/logo.png" alt="Logo Almacén Central" class="logo-almacen">
    </header>

    <main class="contenido">
        <div class="gestion-container">
            <!-- Formulario principal (siempre visible) -->
            <form id="form-principal" class="formulario" autocomplete="off" novalidate>
                <div class="campo">
                    <label for="codigo" class="form-label">Código (ID)</label>
                    <input type="number" id="codigo" class="form-control" min="1" step="1" inputmode="numeric">
                </div>
                <div class="campo">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad" class="form-control" min="1" step="1" inputmode="numeric">
                </div>
                <div class="campo">
                    <label for="precio" class="form-label">
                        Precio
                        <span class="texto-ayuda">(*solo si es alta de productos)</span>
                    </label>
                    <input type="number" id="precio" class="form-control" min="1" step="1" inputmode="decimal">
                </div>
            </form>

            <!-- Acciones -->
            <div class="acciones">
                <button type="button" id="btn-alta" class="btn-accion">Alta</button>
                <button type="button" id="btn-baja" class="btn-accion">Baja</button>
                <button type="button" id="btn-stock-bajo" class="btn-accion">Stock Bajo</button>
                <button type="button" id="btn-mostrar" class="btn-accion">Mostrar</button>
                <button type="button" id="btn-agregar" class="btn-accion" data-bs-toggle="modal"
                    data-bs-target="#modalAgregar">Agregar</button>
                <button type="button" id="btn-borrar" class="btn-accion">Borrar</button>
            </div>

            <!-- Mensajes del sistema -->
            <p id="mensaje-sistema" class="mensaje" role="status" aria-live="polite"></p>

            <!-- Tabla de productos -->
            <div id="tabla-container" class="tabla-container oculto">
                <table id="tabla-productos" class="tabla-productos">
                    <thead id="tabla-cabecera"></thead>
                    <tbody id="tabla-cuerpo"></tbody>
                </table>
            </div>

            <p id="contador-productos" class="contador oculto"></p>
        </div>
    </main>

    <!-- Modal AGREGAR -->
    <div class="modal fade" id="modalAgregar" tabindex="-1" aria-labelledby="modalAgregarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAgregarLabel">Agregar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="form-agregar" autocomplete="off" novalidate>
                        <div class="campo">
                            <label for="mod_codigo" class="form-label">Código</label>
                            <input type="number" id="mod_codigo" class="form-control" min="1" step="1"
                                inputmode="numeric" required>
                        </div>
                        <div class="campo">
                            <label for="mod_nombre" class="form-label">Descripción</label>
                            <input type="text" id="mod_nombre" class="form-control" required>
                        </div>
                        <div class="campo">
                            <label for="mod_cantidad" class="form-label">Cantidad</label>
                            <input type="number" id="mod_cantidad" class="form-control" min="1" step="1"
                                inputmode="numeric" required>
                        </div>
                        <div class="campo">
                            <label for="mod_precio" class="form-label">Precio Costo</label>
                            <input type="number" id="mod_precio" class="form-control" min="0.01" step="0.01"
                                inputmode="decimal" required>
                        </div>
                        <div class="campo">
                            <label for="mod_imagen" class="form-label">
                                Imagen (opcional)
                                <span class="texto-ayuda">jpg, png, gif o webp. Máximo 5 MB.</span>
                            </label>
                            <input type="file" id="mod_imagen" 
                                accept="image/jpeg,image/png,image/gif,image/webp">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btn-guardar-nuevo" class="btn-accion">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap (necesario para el modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>

</html>
