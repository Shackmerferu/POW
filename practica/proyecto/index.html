<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Armazén Central</title>
    
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .barra-superior { background-color: #3b82f6; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .barra-superior h2 { margin: 0; }
        .formulario { margin: 20px; padding: 20px; border: 1px solid #3b82f6; width: 250px; }
        .botones { margin: 20px; }
        .botones button { background-color: #0b81f0; color: white; padding: 10px 15px; border: none; cursor: pointer; font-weight: bold; margin-right: 5px; }
        table { width: 90%; border-collapse: collapse; margin: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f3f4f6; }
        .modal { display: none; position: fixed; top: 10%; left: 30%; background: white; padding: 20px; border: 2px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 300px; }
        #pantalla-resultados { margin-left: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Esta es la barra azul con el logo que te falta -->
    <div class="barra-superior">
        <h2>ARMAZÉM CENTRAL</h2>
        <img src="logo.png" alt="Logo" height="50">
    </div>

    <!-- A partir de acá ya sigue tu formulario... -->
    <div class="formulario">

    <!-- ==========================================
         SECCIÓN HTML (EL ESQUELETO VISUAL)
         Lo que el usuario ve e interactúa en pantalla
    =========================================== -->
    
    <!-- Barra superior con el nombre del negocio y el logo -->
    <div class="barra-superior">
        <h2>ARMAZÉM CENTRAL</h2>
        <img src="logo.png" alt="Logo" height="50">
    </div>

    <!-- Formulario principal para ingresar datos rápidos (Alta, Baja, etc.) -->
    <div class="formulario">
        <!-- Los 'id' son vitales: son los nombres únicos para que JavaScript los encuentre después -->
        <label>Codigo (ID): <br><input type="number" id="codigo"></label><br><br>
        <label>Cantidad: <br><input type="number" id="cantidad"></label><br><br>
        <label>Precio: <br><input type="number" id="precio"></label>
    </div>

    <!-- Botonera con las 6 funcionalidades exigidas en el examen -->
    <div class="botones">
        <button id="btn-alta">ALTA</button>
        <button id="btn-baja">BAJA</button>
        <button id="btn-stockbajo">STOCK BAJO</button>
        <button id="btn-mostrar">MOSTRAR</button>
        <button id="btn-agregar">AGREGAR</button>
        <button id="btn-borrar">BORRAR</button>
    </div>

    <!-- Contenedor vacío. Acá JavaScript va a inyectar (escribir) las tablas o mensajes de error -->
    <div id="pantalla-resultados"></div>

    <!-- Ventana emergente (Modal) para AGREGAR un producto nuevo. 
         Tiene sus propios inputs con IDs diferentes (mod-codigo, mod-desc) para no mezclarse con los de arriba -->
    <div id="modal-agregar" class="modal">
        <h3 style="margin-top: 0;">Agregar Producto</h3>
        <label>Codigo: <br><input type="number" id="mod-codigo"></label><br><br>
        <label>Descripcion: <br><input type="text" id="mod-desc"></label><br><br>
        <label>Cantidad: <br><input type="number" id="mod-cant"></label><br><br>
        <label>Precio Costo: <br><input type="number" id="mod-precio"></label><br><br>
        <label>Cant. Minima: <br><input type="number" id="mod-min"></label><br><br>
        <button id="btn-guardar-nuevo" style="background: #10b981; color: white; border: none; padding: 8px;">GUARDAR</button>
        <button id="btn-cerrar-modal" style="padding: 8px;">Cancelar</button>
    </div>

    <!-- ==========================================
         SECCIÓN JAVASCRIPT (EL SISTEMA NERVIOSO)
         La lógica que conecta los botones con el PHP y la Base de Datos
    =========================================== -->
    <script>
        // Guardamos en una constante el contenedor donde vamos a imprimir todo, para no buscarlo a cada rato
        const pantalla = document.getElementById('pantalla-resultados');

        /* ---------------------------------------------------------
           FUNCIONALIDAD 1: MOSTRAR
           Trae todos los productos de la base y los dibuja en una tabla
        --------------------------------------------------------- */
        // Escuchamos el clic en el botón Mostrar
        document.getElementById('btn-mostrar').addEventListener('click', () => {
            
            // Mandamos la petición al PHP (por defecto hace un "SELECT * FROM productos")
            fetch('api_almacen/almacen_api.php?action=listar')
            .then(res => res.json()) // Traducimos la respuesta a formato JSON (Objeto)
            .then(datos => {
                
                // Si el PHP devolvió status 200 (Todo salió bien)
                if (datos.status === 200) {
                    
                    // Empezamos a armar la tabla HTML como si fuera un texto gigante
                    let html = `<table><tr><th>ID</th><th>Nombre</th><th>Cant</th><th>Precio $</th><th>cant mínima</th><th>Valor $$</th></tr>`;
                    
                    // Recorremos cada producto de la lista que vino de la base de datos
                    datos.productos.forEach(p => {
                        // Calculamos el requerimiento extra: Cantidad multiplicada por el Precio
                        let valorTotal = p.cantidad * p.precio_costo;
                        
                        // Le sumamos a la tabla una fila (<tr>) con los datos del producto actual (<td>)
                        html += `<tr><td>${p.codigo}</td><td>${p.nombre}</td><td>${p.cantidad}</td><td>${p.precio_costo}</td><td>${p.cantidad_minima}</td><td>${valorTotal}</td></tr>`;
                    });
                    
                    // Cerramos la etiqueta de la tabla
                    html += `</table>`;
                    
                    // Inyectamos todo este texto HTML adentro de la pantalla para que el usuario lo vea
                    pantalla.innerHTML = html;
                }
            });
        });

        /* ---------------------------------------------------------
           FUNCIONALIDAD 2: STOCK BAJO
           Igual que Mostrar, pero filtrando los que tienen poca cantidad
        --------------------------------------------------------- */
        document.getElementById('btn-stockbajo').addEventListener('click', () => {
            fetch('api_almacen/almacen_api.php?action=listar')
            .then(res => res.json())
            .then(datos => {
                if (datos.status === 200) {
                    let html = `<h3>Productos por debajo de la cantidad mínima</h3><table><tr><th>ID</th><th>Nombre</th><th>Cant</th><th>Precio $</th><th>cant mínima</th></tr>`;
                    
                    // Creamos una variable para contar cuántos productos están en falta
                    let count = 0;
                    
                    datos.productos.forEach(p => {
                        // LA CLAVE: Si la cantidad actual es menor o igual a la mínima permitida...
                        if (parseInt(p.cantidad) <= parseInt(p.cantidad_minima)) {
                            // ...lo sumamos a la tabla
                            html += `<tr><td>${p.codigo}</td><td>${p.nombre}</td><td>${p.cantidad}</td><td>${p.precio_costo}</td><td>${p.cantidad_minima}</td></tr>`;
                            // ...y aumentamos el contador en 1
                            count++;
                        }
                    });
                    
                    // Agregamos el texto final con el total contado
                    html += `</table><p>Cantidad de productos: ${count}</p>`;
                    pantalla.innerHTML = html;
                }
            });
        });

        /* ---------------------------------------------------------
           FUNCIONALIDAD 3: BAJA (Descontar stock por venta/rotura)
        --------------------------------------------------------- */
        document.getElementById('btn-baja').addEventListener('click', () => {
            // Capturamos el código y la cantidad que escribió el usuario en las cajitas
            let cod = document.getElementById('codigo').value;
            let cant = parseInt(document.getElementById('cantidad').value); // Convertimos el texto a número entero
            
            // Si el código está vacío o la cantidad es negativa/cero, cortamos acá
            if (!cod || cant <= 0) { alert("Ingrese Código y Cantidad válidos."); return; }

            // PASO 1: Buscamos si el código existe en la BD
            fetch(`api_almacen/almacen_api.php?action=listar&codigo=${cod}`)
            .then(res => res.json())
            .then(datos => {
                
                // Si el producto existe y la BD nos devolvió datos
                if (datos.status === 200 && datos.cantidad > 0) {
                    let p = datos.productos[0]; // Guardamos el producto original
                    
                    // Control: Si quiere restar 50 pero solo hay 10 en stock, le tiramos error
                    if (cant > parseInt(p.cantidad)) {
                        pantalla.innerHTML = `<h3>La cantidad a retirar es superior al Stock(${p.cantidad})</h3>`;
                        return; // Cortamos la ejecución
                    }
                    
                    // Calculamos la resta
                    let nuevoStock = parseInt(p.cantidad) - cant;
                    
                    // PASO 2: Mandamos a modificar. Le enviamos TODOS los datos originales, pero con el stock actualizado
                    let url = `api_almacen/almacen_api.php?action=modificar&codigo=${p.codigo}&nombre=${p.nombre}&precio_costo=${p.precio_costo}&cantidad_minima=${p.cantidad_minima}&cantidad=${nuevoStock}`;
                    
                    fetch(url).then(r => r.json()).then(d => { 
                        if (d.status === 200) pantalla.innerHTML = `<h3>Actualizado</h3>`; 
                    });
                    
                } else {
                    // Si el PHP no encontró el producto
                    pantalla.innerHTML = `<h3>Código Inexistente</h3>`;
                }
            });
        });

        /* ---------------------------------------------------------
           FUNCIONALIDAD 4: ALTA (Comprar mercadería y sumar stock)
        --------------------------------------------------------- */
        document.getElementById('btn-alta').addEventListener('click', () => {
            // Capturamos los tres campos
            let cod = document.getElementById('codigo').value;
            let cant = parseInt(document.getElementById('cantidad').value);
            let precio = parseFloat(document.getElementById('precio').value); // parseFloat porque el precio puede tener decimales
            
            if (!cod || cant <= 0 || precio <= 0) { alert("Faltan datos válidos."); return; }

            // Buscamos el producto actual para saber su stock y precio viejos
            fetch(`api_almacen/almacen_api.php?action=listar&codigo=${cod}`)
            .then(res => res.json())
            .then(datos => {
                if (datos.status === 200 && datos.cantidad > 0) {
                    let p = datos.productos[0];
                    
                    // Sumamos el stock que ya había con el que estamos comprando
                    let stockNuevo = parseInt(p.cantidad) + cant;
                    
                    // Fórmula Precio Promedio Ponderado: (Capital Viejo + Capital Nuevo) / Cantidad Total
                    let ppp = ((p.cantidad * p.precio_costo) + (cant * precio)) / stockNuevo;
                    
                    // Mandamos a modificar la base de datos
                    let url = `api_almacen/almacen_api.php?action=modificar&codigo=${p.codigo}&nombre=${p.nombre}&precio_costo=${ppp}&cantidad_minima=${p.cantidad_minima}&cantidad=${stockNuevo}`;
                    
                    fetch(url).then(r => r.json()).then(d => { 
                        if (d.status === 200) pantalla.innerHTML = `<h3>Actualizado</h3>`; 
                    });
                } else {
                    pantalla.innerHTML = `<h3>Código Inexistente</h3>`;
                }
            });
        });

        /* ---------------------------------------------------------
           FUNCIONALIDAD 5: BORRAR
        --------------------------------------------------------- */
        document.getElementById('btn-borrar').addEventListener('click', () => {
            let cod = document.getElementById('codigo').value;
            if (!cod) { alert("Ingrese el código a borrar"); return; }
            
            // Le pedimos a la API que borre el registro de ese código
            fetch(`api_almacen/almacen_api.php?action=borrar&codigo=${cod}`)
            .then(res => res.json())
            .then(datos => { 
                if (datos.status === 200) pantalla.innerHTML = `<h3>eliminado</h3>`; 
            });
        });

        /* ---------------------------------------------------------
           FUNCIONALIDAD 6: AGREGAR (Abrir modal y guardar nuevo)
        --------------------------------------------------------- */
        const modal = document.getElementById('modal-agregar');
        
        // Al hacer clic en AGREGAR, le cambiamos el estilo a la ventana para que se vea (display: block)
        document.getElementById('btn-agregar').addEventListener('click', () => modal.style.display = 'block');
        
        // Al hacer clic en Cancelar, volvemos a ocultarla (display: none)
        document.getElementById('btn-cerrar-modal').addEventListener('click', () => modal.style.display = 'none');
        
        // Lógica del botón GUARDAR dentro de la ventana emergente
        document.getElementById('btn-guardar-nuevo').addEventListener('click', () => {
            
            // Capturamos los datos de las cajitas exclusivas de la ventana modal
            let cod = document.getElementById('mod-codigo').value;
            let desc = document.getElementById('mod-desc').value;
            let cant = document.getElementById('mod-cant').value;
            let precio = document.getElementById('mod-precio').value;
            let min = document.getElementById('mod-min').value;

            // Validación: ninguno puede estar vacío y los números no pueden ser negativos
            if(!cod || !desc || cant < 0 || precio < 0 || min < 0) { alert("Datos inválidos."); return; }

            // Primero controlamos que no estemos intentando agregar un ID que ya existe
            fetch(`api_almacen/almacen_api.php?action=listar&codigo=${cod}`)
            .then(res => res.json())
            .then(datos => {
                
                // Si la BD devuelve datos, el código ya está ocupado
                if (datos.status === 200 && datos.cantidad > 0) {
                    alert("El producto ya existe en la base de datos.");
                } else {
                    // Si está libre, ejecutamos el action=insertar pasando todas las variables
                    let url = `api_almacen/almacen_api.php?action=insertar&codigo=${cod}&nombre=${desc}&cantidad=${cant}&precio_costo=${precio}&cantidad_minima=${min}`;
                    
                    fetch(url).then(r => r.json()).then(d => {
                        if (d.status === 200) {
                            alert("Producto guardado exitosamente");
                            modal.style.display = 'none'; // Cerramos la ventana
                            
                            // TRUCO: Simulamos un clic en el botón MOSTRAR para que la tabla se recargue sola
                            document.getElementById('btn-mostrar').click(); 
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
