


<HEAD>

<SCRIPT LANGUAGE="JavaScript">

<!-- Comienzo
function ignoraEspacios(string) {
var temp = "";
string = '' + string;
splitstring = string.split(" ");
for(i = 0; i < splitstring.length; i++)
temp += splitstring[i];
return temp;
}
//  Fin -->

</script>
</HEAD>


<BODY>

<center>
<pre>
Ejemplo de la función ignoraEspacios

	Antes:  String = H o l a  m u n d o<br>
	Después:  String = <script language="JavaScript">
						document.write(ignoraEspacios("H o l a  m u n d o"));
						</script>
</pre>
</center>

<!-- A continuación es otro ejemplo, en un formulario -->

<p>

<center>
Ingrese un string con espacios en el área de texto.

<form>
<input type=text size=25 onBlur="this.value=ignoraEspacios(this.value);">
<input type=button value="Ok">
</form>
</center>
