<HTML>
<HEAD>
<TITLE>Validaciones de Palabras</TITLE>
<SCRIPT language="JavaScript">

   mayusculas="ABCDEFGHIJKLMNÑOPQRSTUVWXYZÁÉÍÓÚÜ";
   minusculas="abcdefghijklmnñopqrstuvwxyzáéíóúü"; 
   error= new creaerror();  
   errores= new Array();

   errores[1]="Campo vacio no contiene ningún valor ";
   errores[2]="Falta carácter alfabético";
   errores[3]="Falta carácter alfabético en minúsculas";
   errores[4]="Falta carácter alfabético en mayúsculas";
     
   // Crea un objeto que guarda un indice a la posición y al mensaje de error
   function creaerror()
   {
   this.valor=0;
   this.posicion=0;
   return this
   }
   
   // Determina si un carácter es una letra minúscula del abecedario contemplado  
   function esminuscula(car)
   {
   return minusculas.indexOf(car)>=0;
   }

   // Determina si un carácter es una letra mayúscula del abecedario contemplado  
   function esmayuscula(car)
   {
   return mayusculas.indexOf(car)>=0;
   }

   // Determina si un carácter es una letra del abecedario contemplado  
   function esletra(car)
   {
   return esminuscula(car) || esmayuscula(car)
   }

   //Comprueba si contenido es una palabra correcta alfabéticamente
   function compruebapalabra(contenido,error) 
   {
   if (contenido.length == 0)
      {
      error.valor=1;
      error.posicion=1; 
      return false;
      }  
   for (var i=0; i<contenido.length; ++i)
      {
      if (!esletra(contenido.charAt(i)))
         {
         error.valor=2;
         error.posicion=i+1;          
         return false;
         } 
      }
   return true
   }
  
   //Comprueba si contenido es una palabra en minúsculas correcta alfabéticamente
   function compruebapalabraenminusculas(contenido,error) 
   {
   if (contenido.length == 0)
      {
      error.valor=1;
      error.posicion=1; 
      return false;
      }  
   for (var i=0; i<contenido.length; ++i)
      {
      if (!esminuscula(contenido.charAt(i)))
         {
         error.valor=3;
         error.posicion=i+1;          
         return false;
         } 
      }
   return true
   }
 
   //Comprueba si contenido es una palabra en mayúsculas correcta alfabéticamente
   function compruebapalabraenmayusculas(contenido,error) 
   {
   if (contenido.length == 0)
      {
      error.valor=1;
      error.posicion=1; 
      return false;
      }  
   for (var i=0; i<contenido.length; ++i)
      {
      if (!esmayuscula(contenido.charAt(i)))
         {
         error.valor=4;
         error.posicion=i+1;          
         return false;
         } 
      }
   return true
   }

   // Ejecuta la validación pedida
   function ejecuta(valor)
   {
   var correcto;
   switch (valor)
      {
      case 1:
         correcto=
           compruebapalabra(window.document.formulario.campo.value,error);
         break;
      case 2:
         correcto=
           compruebapalabraenminusculas(window.document.formulario.campo.value,error);
         break;
      case 3:
         correcto=
          compruebapalabraenmayusculas(window.document.formulario.campo.value,error);
         break;
      default:
         break; 
      }
   if (correcto)
      alert("El campo es válido")
   else
      alert("El campo NO es válido. ERROR:"+errores[error.valor]+
            " en la posicion "+error.posicion);
   }
  
</SCRIPT>
</HEAD>
<BODY>
<FORM NAME="formulario" ACTION="">

   <CENTER>
   <B>Validaciones de Palabras</B><BR><BR>
   Palabra:
   <INPUT TYPE="Text" VALUE="" NAME="campo"><BR><BR>
   <INPUT TYPE="Button" VALUE="Validapalabra" onClick="ejecuta(1)">
   <INPUT TYPE="Button" VALUE="Validaminúsculas" onClick="ejecuta(2)"> 
   <INPUT TYPE="Button" VALUE="Validamayúsculas" onClick="ejecuta(3)">
   </CENTER>
   
</FORM>
</BODY>
</HTML>
