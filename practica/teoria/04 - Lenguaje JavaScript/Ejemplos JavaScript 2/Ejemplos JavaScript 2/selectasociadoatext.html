<HTML>
<HEAD>
<TITLE>Select asociado a un campo Text</TITLE>
<SCRIPT language="JavaScript">
   
   // Conjunto de códigos 
   codigos= new Array();
   codigos[0]="";
   codigos[1]="A100";
   codigos[2]="B120";
   codigos[3]="B125";
   codigos[4]="C100";

   // Información adicional de cada uno de los códigos
   valores= new Array()
   valores[0]="Ninguno";
   valores[1]="Valor informativo de A100";
   valores[2]="Valor informativo de B120";
   valores[3]="Valor informativo de B125";
   valores[4]="Valor informativo de C100";

   // Conjunto de letras mayúsculas y minúsculas
   mayusculas="ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÚÜÑ";
   minusculas="abcdefghijklmnopqrstuvwxyzáéíóúüñ"; 
 
   // Escribe el código HTML correspondiente a las opciones del Select
   function escribeopcionesselect(codigos,valores)
   {
   for (var i=0;i<codigos.length;i++)
      {
      window.document.write('<OPTION VALUE="'+codigos[i]+'">'+codigos[i]);
      if (codigos[i]!="")
         window.document.write(':');
      window.document.writeln(valores[i]+'</OPTION>');
      } 
   }
  
   // Convierte las letras del string valor a mayúsculas
   function amayusculas(valor)
   {
   var salida="";
   for (var i=0; i<valor.length; ++i)
      {
      var car=valor.charAt(i);
      var pos=minusculas.indexOf(car);
      if (pos>=0)
         car=mayusculas.charAt(pos);
      salida+=car;
      }
   return salida;
   }

   // Convierte las letras del string valor a minúsculas
   function aminusculas(valor)
   {
   var salida="";
   for (var i=0; i<valor.length; ++i)
      {
      var car=valor.charAt(i);
      var pos=mayusculas.indexOf(car);
      if (pos>=0)
         car=minusculas.charAt(pos);
      salida+=car;
      }
   return salida;
   }

   // Convierte la primera letra de valor a mayúsculas y el resto a minúsculas
   function normaliza(valor)
   {
   var prim="";
   var ult="";
   var salida="";
   if (valor.length>0)
      prim=valor.charAt(0);
   if (valor.length>1)
      ult=valor.substring(1,valor.length);
   salida=amayusculas(prim)+aminusculas(ult);
   return salida;
   }
  
   // Activa la opción correspondiente al valor del elemento texto  
   function cambiaselect(form,codigos,campo,select)
   {
   var cadena1='normaliza(form.'+campo+'.value)';
   var cod1=eval(cadena1);
   encontrado=false;
   for (var i=0;i<codigos.length;i++)
      {
      if (codigos[i]==cod1)
         {
         encontrado=true;
         break;
         }   
      }
   if (!encontrado) // Código inexistente
      {
      alert("No existe este código "+cod1);
      var cadena='form.'+select+'.selectedIndex=0';
      eval(cadena);
      var cadena='form.'+campo+'.value=""';
      eval(cadena);
      return false;
      }
   else
      {
      var cadena='form.'+select+'.selectedIndex='+i;
      eval(cadena);
      return true;
      }
   }
 
   // Actualiza el elemento Text con el código escogido en el Select
   function cambiatext(form,campo,select)
   {
   var cadena='form.'+campo+'.value=';
   cadena+='form.'+select+'.options';
   cadena+='[form.'+select+'.selectedIndex].value';
   eval(cadena); 
   }
 
</SCRIPT>
</HEAD>
<BODY>
<FORM NAME="formulario">
   
   <CENTER>
   <B>Select asociado a Text</B><BR><BR>
   Código:
   <INPUT TYPE="Text" VALUE="" NAME="Campo" MAXLENGTH=4 SIZE=4         
    onBlur="cambiaselect(form,codigos,'Campo','Select')">
   <SELECT NAME="Select"
    onChange="cambiatext(form,'Campo','Select')">
   <SCRIPT Language="JavaScript">
      escribeopcionesselect(codigos,valores)
  </SCRIPT>
  </SELECT>
  </CENTER>
  
</FORM>
</BODY>
</HTML>
