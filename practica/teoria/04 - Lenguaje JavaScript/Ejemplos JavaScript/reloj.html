<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Untitled</title>
	
</head>

<body>
 <div id="reloj"></div>
<script>
	function reloj()
	{
		var dia= new Date();
		
		var hora= dia.getHours()+":"+dia.getMinutes()+":"+dia.getSeconds();
		hora='<p style="color:red;font-family:verdana;font-size:40px">'+hora+'</p>';
		document.getElementById("reloj").innerHTML = hora;
		setTimeout("reloj()", 100);
	}
	
    reloj();
</script>


</body>
</html>
