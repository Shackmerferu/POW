<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
<head>
	<title>Untitled</title>
	<script>
		function confirmar()
		{
			//var resultado= confirm('está seguro que desea ir al sito de google');
			//return resultado;
			return confirm('está seguro que desea ir al sito de google');
		}
	</script>
</head>

<body>
    Usando confirm con una función: 
	<a href="http://www.google.com.ar" onclick="return confirmar()">Ir al sitio de Google</a>
	
	<br><br>
	Usando confirm dentro del evento: <a href="http://www.google.com.ar" onclick="return confirm('está seguro que desea ir al sito de google');">Ir al sitio de Google</a>
   <!-- Notese que siempre lleva el return para pasasle el verdadero o falso al link-->

</body>
</html>
