<!DOCTYPE html>
<html>
<body>

<h2>Bloques con const</h2>

<p id="demo1"></p>

<script>
	const  x = 10;// aqui x vale 10
	
	{  
		const x = 2;// aqui x vale 2
	}
     
	// aqui x vale 10
	document.getElementById("demo1").innerHTML = "x vale" + x;
</script>

<h2>Bloques con let</h2>

<p id="demo2"></p>

<script>
	let y = 22;// aqui  y vale 10
	{  
		let y = 2;// aqui y vale 2
	}
    
	// aqui  yvale 22
	document.getElementById("demo2").innerHTML = "y vale " + y;
	
</script>

<h2>Bloques con var no se aplica</h2>

<p id="demo3"></p>

<script>
	var z = 4;// aqui  z vale 4
	{  
		var z = 2;// aqui z vale 2
	}

	// aqui  z vale 2
	document.getElementById("demo3").innerHTML = "z vale " + z;

</script>
</body>
</html>
