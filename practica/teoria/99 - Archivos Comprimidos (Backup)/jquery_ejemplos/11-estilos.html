<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
  $("button").click(function(){
    $("h1, h2, p").addClass("blue");
    $("div").addClass("important");
  });
});
</script>
<style>
.important {
  font-weight: bold;
  font-size: xx-large;
}

.blue {
  color: blue;
}
</style>
</head>
<body>

<h1>Encabezado 1</h1>
<h2><h1>Encabezado  2</h2>

<p>Este es un parrafo.</p>
<p>Este es otro parrafo.</p>

<div>Esto es muy importante!</div><br>

<button>Agregar clases a los elementos</button>

</body>
</html>
