<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
$(document).ready(function(){
  $("#btn1").click(function(){
    alert("Text: " + $("#test").text());
  });
  $("#btn2").click(function(){
    alert("HTML: " + $("#test").html());
  });
});
</script>
</head>
<body>

<p id="test">Este es un texto con la <b>Palabra</b> en negrita.</p>

<button id="btn1">Mostrar Texto</button>
<button id="btn2">Mostrar tecto con HTML</button>

</body>
</html>
