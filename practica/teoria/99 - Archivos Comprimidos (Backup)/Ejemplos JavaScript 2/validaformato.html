<HTML>
<HEAD>
<TITLE>Validaciones según un formato</TITLE>
<SCRIPT language="JavaScript">
  
   // Identificación de los caracteres del formato que forman parte de la máscara
   alfabetico="Aa";
   numerico="Nn";
   alfanumerico="Xx";
   amayusculas=">";
   aminusculas="<";
   escapado="%";
   abrirconjunto="[";
   cerrarconjunto="]"; 
   
   mayusculas="ABCDEFGHIJKLMNÑOPQRSTUVWXYZÁÉÍÓÚÜ";
   minusculas="abcdefghijklmnñopqrstuvwxyzáéíóúü"; 
   numeros="0123456789";
   error= new creaerror();  
   errores= new Array();
  
   errores[1]="Campo vacio no contiene ningún valor ";
   errores[2]="Falta carácter alfabético";
   errores[3]="Falta carácter alfabético en minúsculas";
   errores[4]="Falta carácter alfabético en mayúsculas";
   errores[5]="Falta carácter numérico";
   errores[6]="Falta carácter alfanumérico"; 
   errores[7]="Falta carácter alfanumérico en minúsculas"; 
   errores[8]="Falta carácter alfanumérico en mayúsculas"; 
   errores[9]="Falta carácter específico"; 
   errores[10]="Faltan caracteres";
   errores[11]="Formato de máscara incorrecto"; 
   errores[12]="Campo con demasiados carácteres"; 
   errores[13]="Falta carácter de un conjunto";
  
   // Crea un objeto que guarda un indice a la posición y al mensaje de error
   function creaerror()
   {
   this.valor=0;
   this.posicion=0;
   return this
   }
   
   // Determina si un carácter es una letra minúscula del abecedario contemplado  
   function esminuscula(car)
   {
   return minusculas.indexOf(car)>=0;
   }

   // Determina si un carácter es una letra mayúscula del abecedario contemplado  
   function esmayuscula(car)
   {
   return mayusculas.indexOf(car)>=0;
   }

   // Determina si un carácter es una letra del abecedario contemplado  
   function esletra(car)
   {
   return esminuscula(car) || esmayuscula(car)
   }

   // Determina si un caracter es un número
   function esnumero(car)
   {
   return (numeros.indexOf(car)>=0)
   }

   function compruebaformato(contenido,formato,error)       
   {
   // Variables de estado
   var enmayusculas=false;
   var enminusculas=false; 
   j=0;
   for (var i=0;i<formato.length;i++)
      {
      if (j>=contenido.length)
         {
         error.valor=10;
         error.posicion=j+1; 
         return false;
         }
      // carácter alfabético
      if (alfabetico.indexOf(formato.charAt(i))>=0&&!enmayusculas
          &&!enminusculas)
         {
         if (esletra(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=2;
            error.posicion=j+1; 
            return false;
            }
         }
      else 
      // carácter alfabético en minúsculas
      if (alfabetico.indexOf(formato.charAt(i))>=0&&!enmayusculas
          &&enminusculas)
         {
         if (esminuscula(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=3;
            error.posicion=j+1; 
            return false;
            }
         }
      else 
      // carácter alfabético en mayúsculas
      if (alfabetico.indexOf(formato.charAt(i))>=0 && enmayusculas
          && !enminusculas)
         {
         if (esmayuscula(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=4;
            error.posicion=j+1; 
            return false;
            }
         }
      else
      //carácter numérico
      if (numerico.indexOf(formato.charAt(i))>=0)
         {
         if (esnumero(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=5;
            error.posicion=j+1; 
            return false;
            }
         } 
      else
      //carácter alfanumérico
      if (alfanumerico.indexOf(formato.charAt(i))>=0  && !enmayusculas
          && !enminusculas)
         {
         if (esletra(contenido.charAt(j))||esnumero(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=6;
            error.posicion=j+1; 
            return false;
            }
         }
      else
      //carácter alfanumérico en minúsculas
      if (alfanumerico.indexOf(formato.charAt(i))>=0  && !enmayusculas
          && enminusculas)
         {
         if (esminuscula(contenido.charAt(j))||esnumero(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=7;
            error.posicion=j+1; 
            return false;
            }
         }
      else
      //carácter alfanumérico en mayúsculas
      if (alfanumerico.indexOf(formato.charAt(i))>=0  && enmayusculas
          && !enminusculas)
         {
         if (esmayuscula(contenido.charAt(j))||esnumero(contenido.charAt(j)))
            j++;
         else
            {
            error.valor=8;
            error.posicion=j+1; 
            return false;
            }
         }
      else
      //carácter de apertura de un conjunto de caracteres
      if (abrirconjunto.indexOf(formato.charAt(i))>=0)
         {
         var conjunto="";
         for (i=i+1;i<formato.length;i++)
            {
            if (escapado.indexOf(formato.charAt(i))>=0)
               {
               i++;
               if (i>=formato.length)
                  {
                  error.valor=11;
                  error.posicion=j+1; 
                  return false;
                  }
               conjunto+=formato.charAt(i);
               }
            else
               if (cerrarconjunto.indexOf(formato.charAt(i))>=0)
                  break;
               else
                  conjunto+=formato.charAt(i);
            }
         if (i>=formato.length)
            {
            error.valor=11;
            error.posicion=j+1; 
            return false;
            }
         if (conjunto.indexOf(contenido.charAt(j))>=0)
            j++;
         else
            {
            error.valor=13;
            error.posicion=j+1; 
            return false;
            }
         }
      // carácter de cierre de un conjunto de caracteres
      else
      if (cerrarconjunto.indexOf(formato.charAt(i))>=0)
         {       
         error.valor=11;
         error.posicion=j+1; 
         return false;
         } 
      else
      //activar\desactivar control mayusculas
      if (amayusculas.indexOf(formato.charAt(i))>=0)
         {
         enmayusculas=!enmayusculas;
         enminusculas=false;
         }
      else
      //activar\desacativar control minusculas
      if (aminusculas.indexOf(formato.charAt(i))>=0)
         {
         enminusculas=!enminusculas;
         enmayusculas=false;
         }
      //carácter concreto 
      else
         {
         if (escapado.indexOf(formato.charAt(i))>=0)
            {
            i++;
            if (i>=formato.length)
               {
               error.valor=11;
               error.posicion=j+1; 
               return false;
               }
            }
         if (formato.charAt(i)==contenido.charAt(j))
            j++;
         else
            {
            error.valor=9;
            error.posicion=j+1; 
            return false;
            }
         }
      }
   if (j<contenido.length)
      {
      error.valor=12;
      error.posicion=j+1; 
      return false;
      }
   else
      return true;
   }
   
   // Ejecuta la validación pedida
   function ejecuta(valor)
   {
   var correcto;
   switch (valor)
   {   
      case 1:
         var mascara=prompt("Dime la máscara del campo","");
         if (mascara!=null)
            correcto=
              compruebaformato(window.document.formulario.campo.value,mascara,error);
         else 
            correcto=true;
         break;
      case 2:
         correcto=
           compruebaformato(window.document.formulario.campo.value,"AA-NNNN-AAA",error);
         break;
      default:
         break; 
      }
   if (correcto)
      alert("El campo es válido")
   else
      alert("El campo NO es válido. ERROR:"+errores[error.valor]+
            " en la posicion "+error.posicion);
   }
  
</SCRIPT>
</HEAD>
<BODY>
<FORM NAME="formulario" ACTION="">

   <CENTER>
   <B>Validaciones según un formato</B><BR><BR>
   Dato:
   <INPUT TYPE="Text" VALUE="" NAME="campo" MAXLENGTH=12 SIZE=12><BR><BR>
   <INPUT TYPE="Button" VALUE="Validaformato" onClick="ejecuta(1)">
   <INPUT TYPE="Button" VALUE="Validamatrícula" onClick="ejecuta(2)"> 
   </CENTER>
   
</FORM>
</BODY>
</HTML>
