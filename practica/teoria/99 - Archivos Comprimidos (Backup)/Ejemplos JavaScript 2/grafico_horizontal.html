<HTML><title>Grafico de Barras </title>
<HEAD>
<SCRIPT LANGUAGE="JavaScript">

function DibujarGraficoBarras()
   {

// estas imagenes son gif´s de 1x1 pixel y estan en el subdirectorio imagenes

   imagenes=new Array();
   imagenes[0]="azul";
   imagenes[1]="rojo";
   imagenes[2]="verde";
   imagenes[3]="amarillo";
   imagenes[4]="marino";
   imagenes[5]="celeste";  

   etiquetas=new Array();
   etiquetas[0]="Enero  ";
   etiquetas[1]="Febrero";
   etiquetas[2]="Marzo  ";
   etiquetas[3]="Abril  ";
   etiquetas[4]="Mayo   ";
   etiquetas[5]="Junio  ";

   valores=new Array();
   valores[0]=122;
   valores[1]=157;
   valores[2]=176;
   valores[3]=194;
   valores[4]=132;
   valores[5]=315;

   n=new Array();
   n[0]=0;
   n[1]=0;
   n[2]=0;
   n[3]=0;
   n[4]=0;
   n[5]=0;

   titulo1= "Gráfico de Barras Horizontal";
   titulo2= "Ventas Mensuales - Primer Semestre de 1998";
   titulo3= "(Valores en Millones de Pesetas)";

   anchotabla=600; 
   anchotextos=125;
 
   document.write('<TABLE BORDER=0 ALIGN=CENTER WIDTH='+anchotabla+'>');
   document.write('<TR><TD COLSPAN=3 ALIGN=CENTER><B>'+titulo1+'</B></TD></TR>');
   document.write('<TR><TD COLSPAN=3 ALIGN=CENTER><B>'+titulo2+'</B><BR><I>'+titulo3+'</I></TD></TR>');
   document.write('<TR><TD COLSPAN=3><HR NOSHADE></TD></TR>');

// calcular máximo valor 

   maximo=0;
   for (var i=0;i<6;i++)
      {
      if (valores[i]>maximo)
         {maximo=valores[i];}
      }

// calcular longitudes gráficos e imprimir linea


   for (var i=0;i<6;i++)
      {
      n[i]=valores[i]/maximo*(anchotabla-anchotextos);   
      document.write('<TR><TD><B>'+etiquetas[i]+'</B></TD>');
      document.write('<TD><IMG SRC="imagenes/'+imagenes[i]+'.gif" HEIGHT=10 WIDTH='+n[i]+' BORDER=1></TD>');
      document.write('<TD>'+valores[i]+'</TD></TR>');  
      }
   document.write('<TR><TD COLSPAN=3><HR NOSHADE></TD></TR></TABLE>');
}

DibujarGraficoBarras();

</SCRIPT>
</HEAD>
</HTML>
