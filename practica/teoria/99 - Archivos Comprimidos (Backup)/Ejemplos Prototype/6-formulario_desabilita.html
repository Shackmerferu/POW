<!doctype html>
<html lang="en">
<head>
    <script src="prototype.js" type="text/javascript"></script>
 
<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
<title>Posicionar en el primer elemento de un formulario</title>

</head>
<body onload="Form.disable($('peticion'));">
<!--body onload="$('apellido').focus();"--> <!--equivale a apellido.focus();-->

<form id="peticion">
Nombre:<input disabled="true" type="text" id="nombre"/><br>  <!-- probar disabled="true"-->
Apellido: <input type="text" id="apellido"/><br>
<input type="radio" name="genero" value="Hombre"/>Hombre
<input type="radio" name="genero" value="Mujer"/>Mujer
</form>

<hr>
<span onclick="Form.enable($('peticion'));">Habilitar formulario</span> | <span onclick="Form.disable($('peticion'));">Desabilita</span>
<br><br>
<span onclick="Form.enable($('peticion'));$('apellido').focus();">Habilitar formulario y foco en apellido</span> 
</body>
</html>
