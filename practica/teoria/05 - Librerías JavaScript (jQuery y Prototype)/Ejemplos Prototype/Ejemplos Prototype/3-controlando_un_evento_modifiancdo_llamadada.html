<!doctype html>
<html lang="en">
<head>
    <script src="prototype.js" type="text/javascript"></script>
 
  <title>Ejemplo de ocultar</title>
 
<script type="text/javascript">
Event.observe(window, 'load', function() {
    Event.observe('featurebox-4-listen', 'click', function(){
        $('featurebox-4').toggle();
        if($('featurebox-4').visible()){
            $('featurebox-4-listen').update('Toggle  Box (Cerrar)');
        } else {
            $('featurebox-4-listen').update('Toggle  Box (Abrir)');
        }
    });
});
</script>

</head>
<body>

<p><span id="featurebox-4-listen">Toggle  Box (escuchando)</span></p>
<div class="featurebox" id="featurebox-4"><div class="featurebox" id="featurebox-2">
    <h3>A h3  "featurebox" div</h3>
    <p>Un texto normal[…]</p>
</div>

</body>
</html>
