<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <style>
        /* Hacemos que la página entera actúe como un gran contenedor flexible */
        body {
            height: 100vh;           /* Altura completa de la pantalla */
            margin: 0;               /* Quitamos márgenes por defecto */
            display: flex;           /* Permite que los componentes se despleguen flexiblemente*/
            flex-direction: column;  /* Coloca los elementos uno debajo del otro */
            justify-content: top; /* Centra verticalmente en toda la pantalla */
            align-items: center;     /* Centra horizontalmente en toda la pantalla */
        }
        th,
        td {
            border: 2px solid #ccc;
        }
    </style>
</head> 
<body>

    <p> 
        Población de los paises con mayor cantidad <br> 
        de habitantes
    </p>

<table class="tabla">
    <thead>
        <tr>
            <th scope="col">Países</th>
            <th scope="col">Cantidad de habitantes</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>China</td>
            <td>1300 millones</td>
        </tr>
        <tr>
            <td>India</td>
            <td>1080 millones</td>
        </tr>
        <tr>
            <td>Estados Unidos</td>
            <td>295 millones</td>
        </tr>
    </tbody>
</table>

</body>
</html>
