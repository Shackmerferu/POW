<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/stylesej13.css">

</head>

<body>
    <div class="container mt-5 text-center text-white" style="max-width: 400px;">
        <div class="banner container bg-secondary text-center text-black fw-bold h1 py-3">
            Calculadora Basica
        </div>
        <div class="container  bg-dark m-0 mb-2 p-4 text-end">
            <small id="operacion" class="text-secondary d-block"></small>
            <span id="pantalla" class="fs-2 fw-bold">0</span>
        </div>
        <div class=" row g-2">
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="limpiar('')"
                    style="background-color: #ff4500;"> CE
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="limpiar('C')"
                    style="background-color: #ff4500;"> C
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="cambiarsigno()"
                    style="background-color: #700000;"> &plusmn;
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="calcularPorcentaje('%')"
                    style="background-color: #700000;"> %
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('7')"
                    style="background-color: #1838c7;"> 7
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('8')"
                    style="background-color: #1838c7;"> 8
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('9')"
                    style="background-color: #1838c7;"> 9
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="elegirOperacion('/')"
                    style="background-color: #700000;"> ÷
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('4')"
                    style="background-color: #1838c7;"> 4
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('5')"
                    style="background-color: #1838c7;"> 5
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('6')"
                    style="background-color: #1838c7;"> 6
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="elegirOperacion('*')"
                    style="background-color: #700000;"> ×
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('1')"
                    style="background-color: #1838c7;"> 1
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('2')"
                    style="background-color: #1838c7;"> 2
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('3')"
                    style="background-color: #1838c7;"> 3
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="elegirOperacion('-')"
                    style="background-color: #700000;"> -
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('0')"
                    style="background-color: #1838c7;"> 0
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="agregarNumero('.')"
                    style="background-color: #1838c7;"> .
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="calcular()"
                    style="background-color: #007002;"> =
                </button></div>
            <div class="col-3 d-flex"><button class="btn w-100 text-white fw-bold" onclick="elegirOperacion('+')"
                    style="background-color: #700000;"> +
                </button></div>
        </div>

    </div>
    <script>

        let opac = '0';
        let opan = '';
        let operacion = undefined;

        function agregarNumero(num) {
            if (num === '.' && opac.includes('.')) return;
            if (opac === '0' && num !== '0') {
                opac = num;
            } else if (!(opac === '0' && num === '0')) {
                opac = opac + num;
            }
            actualizarPantalla();
        }

        function elegirOperacion(op) {
            if (opac === '0') return;
            if (opac === '') {
                operacion = op;
                actualizarPantalla();
                return;
            }

            if (opan !== '') {
                calcular();
            }

            operacion = op;
            opan = opac;
            opac = '';
            actualizarPantalla();
        }

        function calcular() {
            let res;
            const ant = parseFloat(opan);
            const act = parseFloat(opac);

            if (isNaN(ant) || isNaN(act)) return;

            switch (operacion) {
                case '+':
                    res = ant + act;
                    break;
                case '-':
                    res = ant - act;
                    break;
                case '*':
                    res = ant * act;
                    break;
                case '/':
                    res = (act === 0) ? 'infinity' : ant / act;
                    break;
                default:
                    return;
            }

            opac = res.toString();
            operacion = undefined;
            opan = '';
            actualizarPantalla();
        }

        //botones ce y c
        function limpiar(tipo) {
            opac = '0';
            if (tipo === 'C') {
                opan = '';
                operacion = undefined;
            }
            actualizarPantalla()
        }

        function cambiarsigno() {
            if (opac === '0' || opac === '') return;
            opac = (parseFloat(opac) * -1).toString();
            actualizarPantalla();
        }

        function calcularPorcentaje() {
            if (opac === '0') return;
            opac = (parseFloat(opac) / 100).toString();
            actualizarPantalla();
        }

        function actualizarPantalla() {
            document.getElementById('pantalla').innerText = opac;


            if (operacion !== undefined) {

                let simbolo = operacion;
                if (simbolo === '/') simbolo = '÷';
                if (simbolo === '*') simbolo = '×';

                document.getElementById('operacion').innerText = `${opan} ${simbolo}`;
            } else {
                document.getElementById('operacion').innerText = '';
            }
        }
    </script>

</body>

</html>
