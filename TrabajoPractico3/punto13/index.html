<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="../css/stylesej13.css">
</head>

<body>
    <div class="calculadora">
        <div class="titulo">Calculadora</div>
        <div class="pantalla">
            <small id="operacion"></small>
            <span id="pantalla">0</span>
        </div>
        <div class="teclado">
            <button class="btn-func" onclick="limpiar('')">CE</button>
            <button class="btn-func" onclick="limpiar('C')">C</button>
            <button class="btn-func" onclick="cambiarsigno()">&plusmn;</button>
            <button class="btn-func" onclick="calcularPorcentaje()">%</button>

            <button class="btn-num" onclick="agregarNumero('7')">7</button>
            <button class="btn-num" onclick="agregarNumero('8')">8</button>
            <button class="btn-num" onclick="agregarNumero('9')">9</button>
            <button class="btn-op" onclick="elegirOperacion('/')">÷</button>

            <button class="btn-num" onclick="agregarNumero('4')">4</button>
            <button class="btn-num" onclick="agregarNumero('5')">5</button>
            <button class="btn-num" onclick="agregarNumero('6')">6</button>
            <button class="btn-op" onclick="elegirOperacion('*')">×</button>

            <button class="btn-num" onclick="agregarNumero('1')">1</button>
            <button class="btn-num" onclick="agregarNumero('2')">2</button>
            <button class="btn-num" onclick="agregarNumero('3')">3</button>
            <button class="btn-op" onclick="elegirOperacion('-')">-</button>

            <button class="btn-num" onclick="agregarNumero('0')">0</button>
            <button class="btn-num" onclick="agregarNumero('.')">.</button>
            <button class="btn-equal" onclick="calcular()">=</button>
            <button class="btn-op" onclick="elegirOperacion('+')">+</button>
        </div>
    </div>

    <script>
        let opac = '0';
        let opan = '';
        let operacion = undefined;

        function redondear(valor) {
            if (typeof valor !== 'number' || !isFinite(valor)) return valor;
            return parseFloat(valor.toFixed(10));
        }

        function agregarNumero(num) {
            if (num === '.' && opac.includes('.')) return;
            if (opac === '0' && num !== '0') {
                opac = num;
            } else if (!(opac === '0' && num === '0')) {
                opac = opac + num;
            }
            actualizarPantalla();
        }

        function elegirOperacion(op) {
            if (opac === '0') return;
            if (opac === '') {
                operacion = op;
                actualizarPantalla();
                return;
            }

            if (opan !== '') {
                calcular();
            }

            operacion = op;
            opan = opac;
            opac = '';
            actualizarPantalla();
        }

        function calcular() {
            let res;
            const ant = parseFloat(opan);
            const act = parseFloat(opac);

            if (isNaN(ant) || isNaN(act)) return;

            switch (operacion) {
                case '+':
                    res = ant + act;
                    break;
                case '-':
                    res = ant - act;
                    break;
                case '*':
                    res = ant * act;
                    break;
                case '/':
                    res = (act === 0) ? 'infinity' : ant / act;
                    break;
                default:
                    return;
            }

            if (typeof res === 'number') res = redondear(res);
            opac = res.toString();
            operacion = undefined;
            opan = '';
            actualizarPantalla();
        }

        function limpiar(tipo) {
            opac = '0';
            if (tipo === 'C') {
                opan = '';
                operacion = undefined;
            }
            actualizarPantalla();
        }

        function cambiarsigno() {
            if (opac === '0' || opac === '') return;
            opac = redondear(parseFloat(opac) * -1).toString();
            actualizarPantalla();
        }

        function calcularPorcentaje() {
            if (opac === '0') return;
            opac = redondear(parseFloat(opac) / 100).toString();
            actualizarPantalla();
        }

        function actualizarPantalla() {
            document.getElementById('pantalla').innerText = opac;

            if (operacion !== undefined) {
                let simbolo = operacion;
                if (simbolo === '/') simbolo = '÷';
                if (simbolo === '*') simbolo = '×';

                const mostrarOp = opan !== '' && !isNaN(parseFloat(opan))
                    ? redondear(parseFloat(opan)).toString()
                    : opan;

                document.getElementById('operacion').innerText = `${mostrarOp} ${simbolo}`;
            } else {
                document.getElementById('operacion').innerText = '';
            }
        }
    </script>

</body>

</html>
