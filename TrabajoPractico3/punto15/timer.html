<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
        }

        .text-gradient {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .card-glass {
            background: rgba(255, 255, 255, .6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .7);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
        }
    </style>
</head>

<body>

    <main class="container py-5 ">
        <div class="row g-5 justify-content-center align-items-center">
            <div class="col-11 col-lg mx-auto">
                <div>
                    <div class="card-glass rounded-4 p-4 p-lg-5 text-center">
                        <a href="index.html" class="btn btn-dark btn-lg rounded-pill px-4 py-2 shadow-sm ">
                            <i class="fa fa-chevron-left" aria-hidden="true"></i>
                        </a>
                        <div class=" text-dark text-center h1 fw-bolder">
                            Lo estaremos contactando!
                        </div>
                        <div class=" text-dark text-center h1 fw-bolder">
                            Nuestra web lleva activa desde: <br>
                            <span id="contador"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <script>
        function actualizarContador() {
            const fechaInicio = new Date(2023, 6, 1, 0, 0, 0);
            var fechalimite = new Date();
            const diferencia = fechalimite - fechaInicio;

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById('contador').innerHTML = `${dias} Dias - ${horas} Horas - ${minutos} Minutos - ${segundos} Segundos`;
        }
        actualizarContador();
        setInterval(actualizarContador, 1000);
    </script>
</body>

</html>
