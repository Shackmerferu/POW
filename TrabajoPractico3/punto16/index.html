<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora CUIL/CUIT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="d-flex align-items-center justify-content-center vh-100 bg-body-tertiary">
    <div class="bg-white rounded-4 shadow-lg p-4" style="width: 340px;">
        <div class="text-center text-uppercase text-secondary fw-semibold small mb-3" style="letter-spacing: 0.15em;">
            Validación CUIL / CUIT
        </div>

        <div class="mb-3">
            <label for="cuil" class="form-label small text-secondary">Ingrese el número (con o sin guiones)</label>
            <input type="text" id="cuil" class="form-control text-center" placeholder="20-12345678-6">
        </div>
        <div class="mb-2">
            <button class="btn btn-primary w-100" onclick="validarCuil()">Validar</button>
        </div>
        
      
        <div id="resultado" class="text-center fw-semibold mt-3 p-2 rounded d-none">
        </div>
    </div>

    <script>
        function validarCuil() {
            
            const inputStr = document.getElementById('cuil').value;
            const resultadoDiv = document.getElementById('resultado');

           resultadoDiv.classList.remove("d-none", "bg-success-subtle", "text-success", "bg-danger-subtle", "text-danger");
          
           let cuil = ""; 


for (let i = 0; i < inputStr.length; i++) {
  
    if (inputStr[i] !== "-") {
        cuil = cuil + inputStr[i];
    }
}
            
            if (cuil.length !== 11 || isNaN(cuil)) {
                mostrarError("Ingrese un CUIL/CUIT válido de 11 números.");
                return;
            }

            const tiposValidos = ["20", "23", "24", "27", "30", "33", "34"];
            const tipoIngresado = cuil.substring(0, 2); // Agarra los primeros 2 números
            
            if (!tiposValidos.includes(tipoIngresado)) {
                mostrarError("El tipo (primeros 2 números) no es válido.");
                return;
            }

            
            const multiplicadores = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
            let suma = 0;

           
            for (let i = 0; i < 10; i++) {
                suma += parseInt(cuil[i]) * multiplicadores[i];
            }

          
            const resto = suma % 11;
            let digitoCalculado = 11 - resto;

           
            if (digitoCalculado === 11) {
                digitoCalculado = 0;
            } else if (digitoCalculado === 10) {
                mostrarError("Error de algoritmo: El dígito da 10. Se debe cambiar el tipo.");
                return;
            }

           
            const digitoIngresado = parseInt(cuil[10]);

            if (digitoCalculado === digitoIngresado) {
                mostrarExito("¡Verdadero! El número es correcto.");
            } else {
                mostrarError("Falso. El dígito verificador no coincide.");
            }
        }

       
        function mostrarError(mensaje) {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerText = mensaje;
            resultadoDiv.classList.add("bg-danger-subtle", "text-danger");
        }

        function mostrarExito(mensaje) {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerText = mensaje;
            resultadoDiv.classList.add("bg-success-subtle", "text-success");
        }
    </script>
</body>

</html>
