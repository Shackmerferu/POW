<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP4 - Actividad 2: Selector de numero aleatorio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
</head>

<body class="bg-body-tertiary">

    <div class="container py-4" style="max-width: 720px;">
        <a href="../index.html" class="volver text-secondary d-inline-block mb-3">&larr; Volver</a>

        <h1 class="h4 mb-1">Selector de numero aleatorio</h1>
        <p class="text-secondary small mb-4">Turnero sin numeros repetidos. Los limites y los numeros salientes se guardan en el navegador.</p>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <form id="formularioLimites" class="row g-2 align-items-end">
                    <div class="col-5 col-md-4">
                        <label for="inferior" class="form-label small mb-1">Limite inferior</label>
                        <input type="number" id="inferior" class="form-control" step="1" min="0" required>
                    </div>
                    <div class="col-5 col-md-4">
                        <label for="superior" class="form-label small mb-1">Limite superior</label>
                        <input type="number" id="superior" class="form-control" step="1" min="1" required>
                    </div>
                    <div class="col-2 col-md-4">
                        <button type="submit" class="btn btn-dark w-100">Aplicar</button>
                    </div>
                </form>
                <div id="avisoLimites" class="small text-danger mt-2 d-none"></div>
            </div>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body text-center">
                <div class="text-secondary small mb-1">Numero sorteado</div>
                <div id="resultado" class="numero display-4 text-body-tertiary">-</div>
                <div id="mensaje" class="small text-secondary" role="status">Presiona Sortear para generar un numero.</div>
                <button id="sortear" type="button" class="btn btn-dark mt-3 px-4">Sortear</button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="text-secondary">
                Salieron <span id="cantidad" class="text-body fw-semibold">0</span> de
                <span id="total" class="text-body fw-semibold">0</span>
            </small>
            <div class="d-flex gap-2">
                <button id="reiniciarNumeros" type="button" class="btn btn-outline-secondary btn-sm">Reiniciar numeros</button>
                <button id="reiniciarTodo" type="button" class="btn btn-outline-secondary btn-sm">Borrar todo</button>
            </div>
        </div>

        <div id="lista" class="d-flex flex-wrap gap-1 mb-4"></div>
    </div>

    <script src="../js/almacen.js"></script>
    <script>
        var CLAVE = 'tp4-actividad2';

        var LIMITES_POR_DEFECTO = { limiteInferior: 10, limiteSuperior: 60 };

        // Formato de guardado propuesto por la consigna.
        var estado = Almacen.leer(CLAVE, {
            limiteInferior: LIMITES_POR_DEFECTO.limiteInferior,
            limiteSuperior: LIMITES_POR_DEFECTO.limiteSuperior,
            numeros: []
        });

        estado.numeros = Array.isArray(estado.numeros) ? estado.numeros : [];

        var formularioLimites = document.getElementById('formularioLimites');
        var campoInferior = document.getElementById('inferior');
        var campoSuperior = document.getElementById('superior');
        var avisoLimites = document.getElementById('avisoLimites');
        var resultado = document.getElementById('resultado');
        var mensaje = document.getElementById('mensaje');
        var lista = document.getElementById('lista');

        formularioLimites.addEventListener('submit', function (evento) {
            evento.preventDefault();
            aplicarLimites();
        });

        document.getElementById('sortear').addEventListener('click', sortear);

        document.getElementById('reiniciarNumeros').addEventListener('click', function () {
            estado.numeros = [];
            guardar();
            pintar();
            mostrarMensaje('Numeros borrados. Se mantienen los limites.', 'text-secondary');
        });

        document.getElementById('reiniciarTodo').addEventListener('click', function () {
            estado.limiteInferior = LIMITES_POR_DEFECTO.limiteInferior;
            estado.limiteSuperior = LIMITES_POR_DEFECTO.limiteSuperior;
            estado.numeros = [];
            guardar();
            pintar();
            mostrarMensaje('Sistema reiniciado a los limites por defecto.', 'text-secondary');
        });

        aplicarLimitesEnPantalla();
        pintar();

        function aplicarLimites() {
            var inferior = parseInt(campoInferior.value, 10);
            var superior = parseInt(campoSuperior.value, 10);

            if (isNaN(inferior) || isNaN(superior) || inferior < 0 || superior < 1 || inferior >= superior) {
                mostrarAviso('El limite inferior debe ser menor que el limite superior.');
                return;
            }

            avisoLimites.classList.add('d-none');
            estado.limiteInferior = inferior;
            estado.limiteSuperior = superior;
            estado.numeros = [];
            guardar();
            pintar();
            mostrarMensaje('Limites entre ' + inferior + ' y ' + superior + '. Los numeros se reiniciaron.', 'text-secondary');
        }

        function sortear() {
            var inferior = estado.limiteInferior;
            var superior = estado.limiteSuperior;

            if (superior - inferior + 1 <= estado.numeros.length) {
                resultado.textContent = '-';
                mostrarMensaje('Todos los numeros estan generados.', 'text-danger fw-semibold');
                return;
            }

            var elegido = elegirNumero(inferior, superior);

            resultado.textContent = elegido.numero;
            resultado.classList.add('pulso');
            mostrarMensaje(elegido.motivo, 'text-secondary');

            estado.numeros.push({ numero: elegido.numero });
            guardar();
            pintarLista();
            setTimeout(function () {
                resultado.classList.remove('pulso');
            }, 450);
        }

        // Si el numero sorteado ya salio, se toma el superior disponible y si no
        // hay, el inferior disponible.
        function elegirNumero(inferior, superior) {
            var candidato = numeroAleatorio(inferior, superior);

            if (!yaSalio(candidato)) {
                return { numero: candidato, motivo: 'Numero generado al azar.' };
            }

            for (var superiorDisponible = candidato + 1; superiorDisponible <= superior; superiorDisponible++) {
                if (!yaSalio(superiorDisponible)) {
                    return {
                        numero: superiorDisponible,
                        motivo: candidato + ' ya habia salido, se muestra el superior disponible.'
                    };
                }
            }

            for (var inferiorDisponible = candidato - 1; inferiorDisponible >= inferior; inferiorDisponible--) {
                if (!yaSalio(inferiorDisponible)) {
                    return {
                        numero: inferiorDisponible,
                        motivo: candidato + ' y todos los superiores ya habian salido, se muestra el inferior disponible.'
                    };
                }
            }

            return { numero: candidato, motivo: 'Numero generado al azar.' };
        }

        function yaSalio(numero) {
            return estado.numeros.some(function (item) {
                return item.numero === numero;
            });
        }

        function guardar() {
            Almacen.guardar(CLAVE, {
                limiteInferior: estado.limiteInferior,
                limiteSuperior: estado.limiteSuperior,
                numeros: estado.numeros
            });
        }

        function aplicarLimitesEnPantalla() {
            campoInferior.value = estado.limiteInferior;
            campoSuperior.value = estado.limiteSuperior;
        }

        function pintar() {
            aplicarLimitesEnPantalla();
            pintarLista();
        }

        function pintarLista() {
            document.getElementById('cantidad').textContent = estado.numeros.length;
            document.getElementById('total').textContent = estado.limiteSuperior - estado.limiteInferior + 1;

            lista.innerHTML = '';
            for (var i = 0; i < estado.numeros.length; i++) {
                var chip = document.createElement('span');
                chip.className = 'badge text-bg-dark';
                chip.textContent = estado.numeros[i].numero;
                lista.appendChild(chip);
            }
        }

        function mostrarMensaje(texto, clase) {
            mensaje.className = 'small ' + clase;
            mensaje.textContent = texto;
        }

        function mostrarAviso(texto) {
            avisoLimites.textContent = texto;
            avisoLimites.classList.remove('d-none');
        }

        function numeroAleatorio(inferior, superior) {
            return Math.floor(Math.random() * (superior - inferior + 1)) + inferior;
        }
    </script>

</body>

</html>
