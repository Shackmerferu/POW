<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP4 - Actividad 1: Adivinar el numero</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
</head>

<body class="bg-body-tertiary">

    <div class="container py-4" style="max-width: 640px;">
        <a href="../index.html" class="volver text-secondary d-inline-block mb-3">&larr; Volver</a>

        <h1 class="h4 mb-1">Adivinar el numero</h1>
        <p class="text-secondary small mb-4">El numero secreto va del 1 al 1000.</p>

        <div class="card shadow-sm">
            <div class="card-body">
                <div id="mensaje" class="alert alert-secondary mb-3 py-2 small" role="status">
                    Ingresa un numero entre 1 y 1000.
                </div>

                <form id="formulario" class="d-flex gap-2">
                    <input type="number" id="numero" class="form-control" min="1" max="1000" step="1"
                        placeholder="Tu numero" autocomplete="off" required>
                    <button type="submit" class="btn btn-dark text-nowrap">Adivinar</button>
                </form>
            </div>
        </div>

        <div class="row g-2 mt-3 text-center">
            <div class="col-6 col-md-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body py-3">
                        <div class="text-secondary small">Intentos</div>
                        <div id="intentos" class="numero fs-4">0</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body py-3">
                        <div class="text-secondary small">Mejor puntaje</div>
                        <div id="mejor" class="numero fs-4">-</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body py-3">
                        <div class="text-secondary small">Partidas</div>
                        <div id="partidas" class="numero fs-4">0</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body py-3">
                        <div class="text-secondary small">Promedio</div>
                        <div id="promedio" class="numero fs-4">-</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-secondary">Partida actual: <span id="rango" class="text-body">1 - 1000</span></small>
            <button id="reiniciar" type="button" class="btn btn-outline-secondary btn-sm">Reiniciar partida</button>
        </div>
    </div>

    <script src="../js/almacen.js"></script>
    <script>
        var CLAVE = 'tp4-actividad1';

        var MINIMO = 1;
        var MAXIMO = 1000;

        // Estado de la partida actual (no se guarda, se reinicia al recargar).
        var secreto = numeroAleatorio();
        var intentos = 0;
        var terminado = false;
        var minimoActual = MINIMO;
        var maximoActual = MAXIMO;

        // Datos que se conservan entre visitas (misma logica de guardado del TP3).
        var historial = Almacen.leer(CLAVE, { partidas: 0, sumaIntentos: 0, mejorPuntaje: null });
        if (historial.mejorPuntaje === undefined) {
            historial.mejorPuntaje = null;
        }

        var formulario = document.getElementById('formulario');
        var campoNumero = document.getElementById('numero');
        var mensaje = document.getElementById('mensaje');
        var elementoRango = document.getElementById('rango');

        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();
            adivinar();
        });

        document.getElementById('reiniciar').addEventListener('click', function () {
            reiniciarPartida();
            campoNumero.focus();
        });

        pintarEstadisticas();
        campoNumero.focus();

        function adivinar() {
            if (terminado) {
                reiniciarPartida();
            }

            var valor = parseInt(campoNumero.value, 10);

            if (isNaN(valor) || valor < MINIMO || valor > MAXIMO) {
                mostrarMensaje('Ingresa un numero entero entre 1 y 1000.', 'alert-danger');
                return;
            }

            intentos++;
            pintarEstadisticas();

            if (valor < secreto) {
                minimoActual = Math.max(minimoActual, valor + 1);
                mostrarMensaje('El numero es muy bajo. Prueba con uno mayor.', 'alert-warning');
            } else if (valor > secreto) {
                maximoActual = Math.min(maximoActual, valor - 1);
                mostrarMensaje('El numero es muy alto. Prueba con uno menor.', 'alert-info');
            } else {
                terminarPartida();
                return;
            }

            pintarRango();
            campoNumero.value = '';
            campoNumero.focus();
        }

        function terminarPartida() {
            terminado = true;

            historial.partidas++;
            historial.sumaIntentos += intentos;
            if (historial.mejorPuntaje === null || intentos < historial.mejorPuntaje) {
                historial.mejorPuntaje = intentos;
            }
            Almacen.guardar(CLAVE, historial);

            mostrarMensaje('&#127881; Correcto, el numero era ' + secreto + '. Lo lograste en ' + intentos + ' '
                + (intentos === 1 ? 'intento' : 'intentos') + '.', 'alert-success');
            mensaje.classList.add('pulso');

            pintarEstadisticas();
            pintarRango();
            campoNumero.value = '';
            campoNumero.focus();
        }

        function reiniciarPartida() {
            secreto = numeroAleatorio();
            intentos = 0;
            terminado = false;
            minimoActual = MINIMO;
            maximoActual = MAXIMO;

            mensaje.classList.remove('pulso');
            mostrarMensaje('Nueva partida. Ingresa un numero entre 1 y 1000.', 'alert-secondary');

            pintarEstadisticas();
            pintarRango();
        }

        function mostrarMensaje(texto, clase) {
            mensaje.className = 'alert ' + clase + ' mb-3 py-2 small';
            mensaje.innerHTML = texto;
        }

        function pintarEstadisticas() {
            document.getElementById('intentos').textContent = intentos;
            document.getElementById('partidas').textContent = historial.partidas;
            document.getElementById('mejor').textContent = historial.mejorPuntaje === null ? '-' : historial.mejorPuntaje;
            document.getElementById('promedio').textContent = historial.partidas === 0 ? '-'
                : promediar(historial.sumaIntentos / historial.partidas);
        }

        function pintarRango() {
            elementoRango.textContent = terminado ? secreto + ' (encontrado)'
                : minimoActual + ' - ' + maximoActual;
        }

        function promediar(valor) {
            return Math.round(valor * 100) / 100;
        }

        function numeroAleatorio() {
            return Math.floor(Math.random() * (MAXIMO - MINIMO + 1)) + MINIMO;
        }
    </script>

</body>

</html>
